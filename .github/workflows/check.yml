name: Check AppleALC resources

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  check-plist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check codec resource catalog
        run: |
          catalog="$RUNNER_TEMP/nmxaudio-applealc"
          python3 NMXAudio/Driver/package-applealc-resources.py Resources "$catalog"
          python3 NMXAudio/Driver/package-applealc-resources.py Resources "$catalog" --verify

      - name: Compile Tahoe audio profiles
        run: |
          python3 NMXAudio/Driver/generate-native-profiles.py Resources \
            "$RUNNER_TEMP/nmx_native_profiles.h" --darwin-major 25 \
            --report "$RUNNER_TEMP/native-profiles.json"
          cc -x c -std=c11 -include stdint.h -fsyntax-only "$RUNNER_TEMP/nmx_native_profiles.h"

      - name: Upload profile coverage
        uses: actions/upload-artifact@v4
        with:
          name: nmx-native-profile-coverage
          path: ${{ runner.temp }}/native-profiles.json
          if-no-files-found: error

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install libxml2-utils

      - name: Find 'real' key in plist files
        run: |
          # Find all plist files and parse them using xmllint, searching for the 'real' key
          for file in $(find . -type f -name "*.plist"); do
            if xmllint --xpath "//real" "$file" 2>/dev/null; then
              echo "::error::Found 'real' key in $file."
              exit 1
            fi
          done
          echo "No 'real' key found."
